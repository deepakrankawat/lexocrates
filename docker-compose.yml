version: '3.8'

services:
  app:
    container_name: lexocrates-app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://www.lexocrates.com}
        - NEXT_PUBLIC_GA_ID=${NEXT_PUBLIC_GA_ID:-}
        - ERPNEXT_URL=${ERPNEXT_URL:-https://portal.lexocrates.com/}
        - ERPNEXT_API_KEY=${ERPNEXT_API_KEY}
        - ERPNEXT_API_SECRET=${ERPNEXT_API_SECRET}
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - lexocrates-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  lexocrates-network:
    name: lexocrates-network
